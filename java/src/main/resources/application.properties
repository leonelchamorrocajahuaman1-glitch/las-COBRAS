spring.application.name=adoptabot
# Recarga de plantillas sin reiniciar durante el desarrollo
spring.thymeleaf.cache=false
# La sesión viaja solo en cookie (evita ;jsessionid= en las URLs)
server.servlet.session.tracking-modes=cookie

# Catálogo compartido con la app Python (se lee desde java/)
adoptabot.catalogo=../data/mascotas.json

# Base de datos propia de la versión Java
adoptabot.db=data/adoptabot.db

# Contraseña del panel del refugio (variable de entorno ADMIN_PASSWORD)
adoptabot.admin-password=${ADMIN_PASSWORD:}
